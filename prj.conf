# Logging
CONFIG_LOG=y

# Button and LED support
CONFIG_DK_LIBRARY=y

# Network
# STEP 2.1 - Configure the Zephyr networking API
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
# STEP 2.2 - Enable and configure the BSD sockets compatible API
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

# Memory
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4192
CONFIG_MAIN_STACK_SIZE=4096

# Modem library
CONFIG_NRF_MODEM_LIB=y
# LTE link control
CONFIG_LTE_LINK_CONTROL=y

# THis is default webhook.site url will expire soon so change this before expire
CONFIG_HTTP_SAMPLE_HOSTNAME="webhook.site"  
CONFIG_HTTP_URL="/545a395d-9878-4d39-965d-2f710d678ebc"

# Enable the fallback DNS feature
CONFIG_LTE_LC_DNS_FALLBACK_MODULE=y

# This is for ipv6 to ipv4 masking   
# Set the NAT64 DNS address here (Trex.fi example)
CONFIG_LTE_LC_DNS_FALLBACK_ADDRESS="2001:67c:2b0::4"
CONFIG_HTTP_CLIENT=y